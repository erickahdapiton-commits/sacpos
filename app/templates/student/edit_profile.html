{% extends "partials/base.html" %}
{% block title %}Edit Profile — SAPCPOS{% endblock %}
{% block page_title %}Edit Profile{% endblock %}

{% block content %}
<div style="max-width:500px;">
  <div class="card">
    <div class="card-title mb-16">✏️ Edit Your Information</div>

    <form method="POST" action="{{ url_for('student.edit_profile') }}">

      <div class="mb-16">
        <label class="text-muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;">Full Name</label>
        <input type="text" name="full_name" value="{{ current_user.full_name }}"
               required class="form-control"
               style="width:100%;margin-top:6px;padding:10px 12px;
                      border:1px solid var(--border);border-radius:var(--radius-sm);
                      background:var(--surface2);color:var(--text);font-size:14px;">
      </div>

      <div class="mb-16">
        <label class="text-muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;">Email</label>
        <input type="email" name="email" value="{{ current_user.email }}"
               required class="form-control"
               style="width:100%;margin-top:6px;padding:10px 12px;
                      border:1px solid var(--border);border-radius:var(--radius-sm);
                      background:var(--surface2);color:var(--text);font-size:14px;">
      </div>

      <hr style="margin:20px 0;border-color:var(--border);border-style:solid;border-width:1px 0 0 0;">

      <p class="text-muted mb-12" style="font-size:13px;">
        Leave password fields blank if you don't want to change it.
      </p>

      <div class="mb-16">
        <label class="text-muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;">New Password</label>
        <input type="password" name="new_password"
               class="form-control"
               style="width:100%;margin-top:6px;padding:10px 12px;
                      border:1px solid var(--border);border-radius:var(--radius-sm);
                      background:var(--surface2);color:var(--text);font-size:14px;">
      </div>

      <div class="mb-24">
        <label class="text-muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;">Confirm New Password</label>
        <input type="password" name="confirm_password"
               class="form-control"
               style="width:100%;margin-top:6px;padding:10px 12px;
                      border:1px solid var(--border);border-radius:var(--radius-sm);
                      background:var(--surface2);color:var(--text);font-size:14px;">
      </div>

      <div class="d-flex gap-12">
        <button type="submit" class="btn btn-primary">💾 Save Changes</button>
        <a href="{{ url_for('student.profile') }}" class="btn btn-ghost">Cancel</a>
      </div>

    </form>
  </div>
</div>
{% endblock %}

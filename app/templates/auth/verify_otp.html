<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify Email — SAPCPOS</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #0a0c14; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }

    .otp-card {
      width: 100%; max-width: 440px;
      background: #0f1117;
      border: 1px solid #1e2235;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .otp-header {
      background: linear-gradient(135deg, #3b7fff 0%, #6366f1 100%);
      padding: 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .otp-header::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 80% at 50% 120%, rgba(255,255,255,0.1) 0%, transparent 70%);
    }
    .otp-icon {
      font-size: 44px; margin-bottom: 12px;
      animation: bounce 2s ease-in-out infinite;
      position: relative; z-index: 1;
    }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .otp-header h1 { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 6px; position: relative; z-index: 1; }
    .otp-header p { font-size: 13px; color: rgba(255,255,255,0.75); position: relative; z-index: 1; }
    .otp-header .email-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); border-radius: 20px; padding: 5px 12px; font-size: 12px; color: #fff; font-weight: 600; margin-top: 10px; position: relative; z-index: 1; }

    .otp-body { padding: 32px; }

    .otp-inputs { display: flex; gap: 10px; justify-content: center; margin: 8px 0 28px; }
    .otp-digit {
      width: 52px; height: 60px;
      background: #131623; border: 2px solid #1e2235; border-radius: 12px;
      color: #fff; font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800;
      text-align: center; outline: none; transition: all 0.2s;
      -moz-appearance: textfield;
    }
    .otp-digit::-webkit-outer-spin-button,
    .otp-digit::-webkit-inner-spin-button { -webkit-appearance: none; }
    .otp-digit:focus { border-color: #3b7fff; background: #0f1420; box-shadow: 0 0 0 3px rgba(59,127,255,0.15); }
    .otp-digit.filled { border-color: #6366f1; background: rgba(99,102,241,0.08); }

    /* Hidden real input for form submission */
    #otp-hidden { display: none; }

    .btn-verify { width: 100%; padding: 14px; background: linear-gradient(135deg, #3b7fff, #6366f1); color: #fff; border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-verify:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 6px 24px rgba(59,127,255,0.35); }
    .btn-verify:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .resend-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; font-size: 13px; color: #4a4d5e; }
    .resend-btn { background: none; border: none; color: #3b7fff; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; padding: 0; }
    .resend-btn:hover { text-decoration: underline; }

    .otp-timer { font-size: 12px; color: #374151; text-align: center; margin-top: 8px; }
    .otp-timer span { color: #f59e0b; font-weight: 600; }

    .alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; font-weight: 500; }
    .alert-danger  { background: rgba(239,68,68,0.12);  border: 1px solid rgba(239,68,68,0.25);  color: #ef4444; }
    .alert-success { background: rgba(34,197,94,0.12);  border: 1px solid rgba(34,197,94,0.25);  color: #22c55e; }
    .alert-info    { background: rgba(59,127,255,0.12); border: 1px solid rgba(59,127,255,0.25); color: #3b7fff; }
    .alert-warning { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25); color: #f59e0b; }

    .back-link { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: #4a4d5e; margin-top: 16px; text-decoration: none; }
    .back-link:hover { color: #94a3b8; text-decoration: none; }
  </style>
</head>
<body>

<div class="otp-card">
  <div class="otp-header">
    <div class="otp-icon">📧</div>
    <h1>Check your inbox</h1>
    <p>We've sent a 6-digit code to</p>
    <div class="email-chip">✉️ {{ email }}</div>
  </div>

  <div class="otp-body">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.verify_otp') }}" id="otp-form">
      <input type="hidden" name="otp" id="otp-hidden"/>

      <div class="otp-inputs">
        <input type="number" class="otp-digit" maxlength="1" min="0" max="9" data-index="0" autocomplete="off"/>
        <input type="number" class="otp-digit" maxlength="1" min="0" max="9" data-index="1"/>
        <input type="number" class="otp-digit" maxlength="1" min="0" max="9" data-index="2"/>
        <input type="number" class="otp-digit" maxlength="1" min="0" max="9" data-index="3"/>
        <input type="number" class="otp-digit" maxlength="1" min="0" max="9" data-index="4"/>
        <input type="number" class="otp-digit" maxlength="1" min="0" max="9" data-index="5"/>
      </div>

      <button type="submit" class="btn-verify" id="verify-btn" disabled>Verify Email →</button>
    </form>

    <div class="otp-timer">Code expires in <span id="countdown">10:00</span></div>

    <div class="resend-row">
      Didn't receive it?
      <form method="POST" action="{{ url_for('auth.resend_otp') }}" style="display:inline;">
        <button type="submit" class="resend-btn">Resend code</button>
      </form>
    </div>

    <a href="{{ url_for('auth.login') }}" class="back-link">← Back to sign in</a>
  </div>
</div>

<script>
  const digits  = document.querySelectorAll('.otp-digit');
  const hidden  = document.getElementById('otp-hidden');
  const btn     = document.getElementById('verify-btn');

  function updateHidden() {
    const val = Array.from(digits).map(d => d.value).join('');
    hidden.value = val;
    btn.disabled = val.length < 6;
    digits.forEach(d => d.classList.toggle('filled', d.value !== ''));
  }

  digits.forEach((digit, i) => {
    digit.addEventListener('input', e => {
      // Only keep one digit
      digit.value = digit.value.slice(-1).replace(/\D/g, '');
      updateHidden();
      if (digit.value && i < digits.length - 1) digits[i + 1].focus();
    });
    digit.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !digit.value && i > 0) {
        digits[i - 1].value = '';
        digits[i - 1].focus();
        updateHidden();
      }
    });
    digit.addEventListener('paste', e => {
      e.preventDefault();
      const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
      pasted.split('').forEach((ch, idx) => { if (digits[idx]) digits[idx].value = ch; });
      updateHidden();
      if (digits[pasted.length - 1]) digits[Math.min(pasted.length, 5)].focus();
    });
  });

  // Auto-submit when all 6 filled
  document.getElementById('otp-form').addEventListener('input', () => {
    const val = Array.from(digits).map(d => d.value).join('');
    if (val.length === 6) setTimeout(() => document.getElementById('otp-form').submit(), 300);
  });

  // Countdown timer
  let seconds = 600;
  const el = document.getElementById('countdown');
  const timer = setInterval(() => {
    seconds--;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    el.textContent = `${m}:${s}`;
    if (seconds <= 0) { clearInterval(timer); el.textContent = 'Expired'; el.style.color = '#ef4444'; }
  }, 1000);

  // Focus first digit
  digits[0].focus();
</script>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
